name: tests

# Pest, phpstan and phpcs.
#
# The framework is checked out as a sibling directory, because composer.json resolves
# lumnd/platophp through a path repository at ../platophp while it is not on Packagist. Once it is,
# the second checkout step and that repository entry both go away.
#
# The feature suite starts real listeners in child processes and talks to them over loopback
# sockets, so a runner needs pcntl and posix and nothing else.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: syntax (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Every file has to parse on the oldest supported runtime. Pest cannot be installed there, and
      # Workerman 5 needs 8.1, so this leg is a syntax sweep rather than a test run
      - name: Lint
        run: find src bootstrap.php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  tests:
    name: tests (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plato-workerman

      - uses: actions/checkout@v4
        with:
          repository: lumnd/platophp
          path: platophp
          token: ${{ secrets.PLATOPHP_TOKEN || github.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl / posix: Workerman's master process, its signal handling and its privilege drop
          extensions: mbstring, json, openssl, pcntl, posix, sockets
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Validate composer.json
        working-directory: plato-workerman
        run: composer validate --strict --no-check-all

      # No composer.lock is committed -- this is a library, and the lock of a library is not the
      # lock its host will resolve.
      - name: Install dependencies
        working-directory: plato-workerman
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Unit tests
        working-directory: plato-workerman
        run: composer test:unit

      - name: Feature tests
        working-directory: plato-workerman
        run: composer test:feature

      # Nothing under tests/ may write into the repository tree; a dirty tree here is a bug in a
      # test, not in the workflow.
      - name: Working tree is clean
        working-directory: plato-workerman
        run: git diff --exit-code && git status --porcelain

  static:
    name: phpstan + phpcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plato-workerman

      - uses: actions/checkout@v4
        with:
          repository: lumnd/platophp
          path: platophp
          token: ${{ secrets.PLATOPHP_TOKEN || github.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, openssl, pcntl, posix, sockets
          coverage: none

      - name: Install dependencies
        working-directory: plato-workerman
        run: composer update --prefer-dist --no-progress --no-interaction

      # phpcs must report zero errors; the only warning left is the 120 column soft limit.
      - name: Coding standard
        working-directory: plato-workerman
        run: composer style

      # phpstan level 5 with no baseline: any error here fails the build.
      - name: Static analysis
        working-directory: plato-workerman
        run: composer analyse

  # The lowest versions the constraints allow, which is where Workerman 4 gets tested: the two
  # majors share one code path here, and the only way to know that it holds is to run the suite
  # against both.
  lowest:
    name: lowest dependencies (php 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plato-workerman

      - uses: actions/checkout@v4
        with:
          repository: lumnd/platophp
          path: platophp
          token: ${{ secrets.PLATOPHP_TOKEN || github.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, openssl, pcntl, posix, sockets
          coverage: none

      - name: Install the lowest allowed dependencies
        working-directory: plato-workerman
        run: composer update --prefer-dist --prefer-lowest --no-progress --no-interaction

      - name: Which Workerman this resolved
        working-directory: plato-workerman
        run: composer show workerman/workerman | head -n 3

      - name: Tests
        working-directory: plato-workerman
        run: composer test
